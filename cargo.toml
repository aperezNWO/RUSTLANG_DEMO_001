[package]
name = "rust-ping-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tiberius = { version = "0.12", default-features = false, features = ["chrono", "tds73"] }
chrono = "0.4"
tokio-util = { version = "0.7", features = ["compat"] }
tokio = { version = "1.36", features = ["full", "net"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"